name: Daily Brand Intelligence Collection

on:
  schedule:
    # 매일 UTC 22:00 = 한국시간 오전 7시
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 스크립트 폴더 자동 탐색
        id: locate
        run: |
          FILE=$(find . -name run_daily.py -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::run_daily.py 를 찾지 못했습니다."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "스크립트 위치: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: 의존성 설치
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 데이터 수집 실행
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: presail-brand-intel/1.0
        run: python run_daily.py

      - name: 결과 커밋 & 푸시
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          mkdir -p data
          git config --global user.name "brand-intel-bot"
          git config --global user.email "bot@presail.local"
          git add data
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없어 커밋을 건너뜁니다."
            exit 0
          fi
          git commit -m "일일 데이터 자동 수집 $(date +'%Y-%m-%d')"
          git push
