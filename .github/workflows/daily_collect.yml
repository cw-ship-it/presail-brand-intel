name: Daily Brand Intelligence Collection
 
on:
  schedule:
    # 매일 UTC 22:00 = 한국시간 오전 7시
    - cron: "0 22 * * *"
  workflow_dispatch: {}
 
permissions:
  contents: write
 
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
 
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: 스크립트 폴더 자동 탐색
        id: locate
        run: |
          FILE=$(find . -name run_daily.py -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::run_daily.py 를 찾지 못했습니다."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "스크립트 위치: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
 
      - name: Reddit 시크릿 등록 여부 확인
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          MISSING=0
          if [ -z "$REDDIT_CLIENT_ID" ]; then
            echo "::error::REDDIT_CLIENT_ID 시크릿이 등록되어 있지 않습니다."
            MISSING=1
          fi
          if [ -z "$REDDIT_CLIENT_SECRET" ]; then
            echo "::error::REDDIT_CLIENT_SECRET 시크릿이 등록되어 있지 않습니다."
            MISSING=1
          fi
          if [ "$MISSING" = "1" ]; then
            echo "Settings → Secrets and variables → Actions 에서 두 값을 등록한 뒤 다시 실행하세요."
            exit 1
          fi
          echo "시크릿 2개 모두 확인됨."
 
      - name: 의존성 설치
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: 데이터 수집 실행
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: presail-brand-intel/1.0
        run: python run_daily.py
 
      # 수집이 조용히 실패하는 것을 막기 위해, CSV가 하나도 안 생기면 job을 실패시킵니다.
      - name: 수집 결과 검증
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          echo "--- data 폴더 내용 ---"
          ls -la data 2>/dev/null || echo "(data 폴더 없음)"
          T="data/google_trends_history.csv"
          R="data/reddit_history.csv"
          [ -f "$T" ] && echo "Google Trends 행 수: $(( $(wc -l < "$T") - 1 ))" || echo "::warning::Google Trends CSV 없음"
          [ -f "$R" ] && echo "Reddit 행 수: $(( $(wc -l < "$R") - 1 ))" || echo "::warning::Reddit CSV 없음"
          if [ ! -f "$T" ] && [ ! -f "$R" ]; then
            echo "::error::CSV가 하나도 생성되지 않았습니다. 위 '데이터 수집 실행' 단계 로그에서 원인을 확인하세요."
            exit 1
          fi
 
      - name: 결과 커밋 & 푸시
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          mkdir -p data
          git config --global user.name "brand-intel-bot"
          git config --global user.email "bot@presail.local"
          git add data
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없어 커밋을 건너뜁니다."
            exit 0
          fi
          git commit -m "일일 데이터 자동 수집 $(date +'%Y-%m-%d')"
          git push
 
