name: Daily Brand Intelligence Collection

on:
  schedule:
    # 매일 UTC 22:00 = 한국시간 오전 7시
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 스크립트 폴더 자동 탐색
        id: locate
        run: |
          FILE=$(find . -name run_daily.py -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::run_daily.py 를 찾지 못했습니다."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "스크립트 위치: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # Reddit 키가 없어도 중단하지 않고, 안내만 남긴 뒤 Trends만 수집합니다.
      - name: Reddit 시크릿 상태 확인
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          if [ -z "$REDDIT_CLIENT_ID" ] || [ -z "$REDDIT_CLIENT_SECRET" ]; then
            echo "::warning::Reddit 시크릿이 없어 이번 실행은 Google Trends만 수집합니다."
          else
            echo "Reddit 시크릿 확인됨. Trends + Reddit 둘 다 수집합니다."
          fi

      - name: 의존성 설치
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 데이터 수집 실행
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: presail-brand-intel/1.0
        run: python run_daily.py

      # 수집이 조용히 실패하는 것을 막습니다. CSV가 하나도 없으면 빨간불로 끝냅니다.
      - name: 수집 결과 검증
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          echo "--- data 폴더 내용 ---"
          ls -la data 2>/dev/null || echo "(data 폴더 없음)"
          T="data/google_trends_history.csv"
          R="data/reddit_history.csv"
          if [ -f "$T" ]; then
            echo "Google Trends 누적 행 수: $(( $(wc -l < "$T") - 1 ))"
          else
            echo "::warning::Google Trends CSV 없음"
          fi
          if [ -f "$R" ]; then
            echo "Reddit 누적 행 수: $(( $(wc -l < "$R") - 1 ))"
          else
            echo "Reddit CSV 없음 (키 미등록 시 정상)"
          fi
          if [ ! -f "$T" ] && [ ! -f "$R" ]; then
            echo "::error::CSV가 하나도 생성되지 않았습니다. 위 '데이터 수집 실행' 로그를 확인하세요."
            exit 1
          fi

      - name: 결과 커밋 & 푸시
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          mkdir -p data
          git config --global user.name "brand-intel-bot"
          git config --global user.email "bot@presail.local"
          git add data
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없어 커밋을 건너뜁니다."
            exit 0
          fi
          git commit -m "일일 데이터 자동 수집 $(date +'%Y-%m-%d')"
          git push
